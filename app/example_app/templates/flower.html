{% extends 'base.html' %}
{% block title %}Blooming Flower Animation{% endblock title %}
{% block content %}
<div id="sun-flower-bg">
  <svg id="flower-svg" width="400" height="600" viewBox="0 0 400 600">
    <g id="stem-group">
      <rect id="stem" x="195" y="400" width="10" height="150" rx="5" fill="url(#stemGradient)" />
      <g id="leaves">
        <path id="leaf-left" d="M200 500 Q170 520 200 540" fill="url(#leafGradient)" opacity="0" />
        <path id="leaf-right" d="M200 520 Q230 540 200 560" fill="url(#leafGradient)" opacity="0" />
      </g>
    </g>
    <g id="petals-group">
      <g id="petals">
        <ellipse class="petal" cx="200" cy="400" rx="0" ry="0" fill="url(#petalGradient)" />
        <ellipse class="petal" cx="200" cy="400" rx="0" ry="0" fill="url(#petalGradient)" transform="rotate(45 200 400)" />
        <ellipse class="petal" cx="200" cy="400" rx="0" ry="0" fill="url(#petalGradient)" transform="rotate(90 200 400)" />
        <ellipse class="petal" cx="200" cy="400" rx="0" ry="0" fill="url(#petalGradient)" transform="rotate(135 200 400)" />
        <ellipse class="petal" cx="200" cy="400" rx="0" ry="0" fill="url(#petalGradient)" transform="rotate(180 200 400)" />
        <ellipse class="petal" cx="200" cy="400" rx="0" ry="0" fill="url(#petalGradient)" transform="rotate(225 200 400)" />
        <ellipse class="petal" cx="200" cy="400" rx="0" ry="0" fill="url(#petalGradient)" transform="rotate(270 200 400)" />
        <ellipse class="petal" cx="200" cy="400" rx="0" ry="0" fill="url(#petalGradient)" transform="rotate(315 200 400)" />
      </g>
      <circle id="flower-center" cx="200" cy="400" r="0" fill="url(#centerGradient)" />
    </g>
    <defs>
      <radialGradient id="sunGradient" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fffde4" />
        <stop offset="100%" stop-color="#ffd700" />
      </radialGradient>
      <linearGradient id="stemGradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#4caf50" />
        <stop offset="100%" stop-color="#2e7d32" />
      </linearGradient>
      <linearGradient id="leafGradient" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#81c784" />
        <stop offset="100%" stop-color="#388e3c" />
      </linearGradient>
      <radialGradient id="petalGradient" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff" />
        <stop offset="100%" stop-color="#e57373" />
      </radialGradient>
      <radialGradient id="centerGradient" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fffde4" />
        <stop offset="100%" stop-color="#ffb300" />
      </radialGradient>
    </defs>
    <circle id="sun" cx="320" cy="100" r="60" fill="url(#sunGradient)" filter="url(#glow)" />
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </svg>
</div>
<link rel="stylesheet" href="/static/flower.css">
<script src="/static/flower.js"></script>
{% endblock content %}
