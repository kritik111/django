<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
TaskFlow - Your Personal Task Manager
</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --success-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --shadow-soft: 0 10px 25px rgba(0,0,0,0.1);
            --shadow-hover: 0 15px 35px rgba(0,0,0,0.15);
        }

        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }

        .hero-gradient {
            background: var(--primary-gradient);
            position: relative;
            overflow: hidden;
        }

        .hero-gradient::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="50" cy="50" r="1" fill="white" opacity="0.1"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .card-modern {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: var(--shadow-soft);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .card-modern:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }

        .btn-gradient-primary {
            background: var(--primary-gradient);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-gradient-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
            color: white;
        }

        .btn-gradient-success {
            background: var(--success-gradient);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
        }

        .btn-gradient-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(79, 172, 254, 0.6);
            color: white;
        }

        .btn-gradient-danger {
            background: var(--secondary-gradient);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(240, 147, 251, 0.4);
        }

        .btn-gradient-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(240, 147, 251, 0.6);
            color: white;
        }

        .input-modern {
            border-radius: 12px;
            border: 2px solid #e1e5e9;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
        }

        .input-modern:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            background: white;
        }

        .todo-item {
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }

        .todo-item.completed {
            border-left-color: #48c78e;
            background: rgba(72, 199, 142, 0.05);
        }

        .todo-item.pending {
            border-left-color: #ff7979;
            background: rgba(255, 121, 121, 0.05);
        }

        .floating-action {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--primary-gradient);
            border: none;
            color: white;
            font-size: 24px;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .floating-action:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.6);
        }

        .stats-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stats-card:hover {
            transform: translateY(-3px);
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <section class="hero is-medium hero-gradient">
        <div class="hero-body">
            <div class="container has-text-centered">
                <h1 class="title is-1 has-text-white">
                    <i class="fas fa-check-circle mr-3"></i>
                    TaskFlow
                </h1>
                <p class="subtitle is-4 has-text-white-ter">
                    Beautiful task management made simple
                </p>
            </div>
        </div>
    </section>

    <main class="section">
        
<div class="container is-max-desktop">
    <!-- Statistics Section -->
    <div class="columns is-multiline mb-6">
        <div class="column is-4">
            <div class="stats-card">
                <div class="has-text-weight-bold is-size-3 has-text-primary">
                    0
                </div>
                <div class="has-text-grey is-size-6">Total Tasks</div>
            </div>
        </div>
        <div class="column is-4">
            <div class="stats-card">
                <div class="has-text-weight-bold is-size-3 has-text-success">
                    0
                </div>
                <div class="has-text-grey is-size-6">Completed</div>
            </div>
        </div>
        <div class="column is-4">
            <div class="stats-card">
                <div class="has-text-weight-bold is-size-3 has-text-warning">
                    0
                </div>
                <div class="has-text-grey is-size-6">Pending</div>
            </div>
        </div>
    </div>

    <!-- Add New Task Section -->
    <div class="card-modern p-6 mb-6">
        <h2 class="title is-3 has-text-centered mb-5">
            <i class="fas fa-plus-circle has-text-primary mr-3"></i>
            Add New Task
        </h2>
        
        <form method="post" class="columns is-vcentered">
            <input type="hidden" name="csrfmiddlewaretoken" value="qZtYO29oHIoNTyxM0Ak0z2oV3xAXkBqKjyjqx9QZevt1oyJfj8GjIhuK59iWAQ4i">
            <div class="column">
                <div class="field">
                    <label class="label is-size-5">Task Title</label>
                    <div class="control has-icons-left">
                        <input class="input is-large input-modern" 
                               type="text" 
                               name="title" 
                               placeholder="What needs to be done?" 
                               value=""
                               required>
                        <span class="icon is-left">
                            <i class="fas fa-tasks"></i>
                        </span>
                    </div>
                </div>
            </div>
            <div class="column is-narrow">
                <div class="field">
                    <label class="label is-size-5">&nbsp;</label>
                    <div class="control">
                        <button type="submit" class="button is-large btn-gradient-primary">
                            <span class="icon">
                                <i class="fas fa-plus"></i>
                            </span>
                            <span>Add Task</span>
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <!-- Tasks List Section -->
    
    <!-- Empty State -->
    <div class="card-modern p-6 has-text-centered">
        <div class="content">
            <i class="fas fa-clipboard-list is-size-1 has-text-grey-lighter mb-4"></i>
            <h3 class="title is-4 has-text-grey">No tasks yet!</h3>
            <p class="subtitle is-6 has-text-grey">
                Start by adding your first task above. You've got this! 🚀
            </p>
        </div>
    </div>
    
</div>

<!-- Quick Add Floating Button -->
<button class="floating-action" id="quickAddBtn" title="Quick Add Task">
    <i class="fas fa-plus"></i>
</button>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Quick add functionality
    const quickAddBtn = document.getElementById('quickAddBtn');
    const taskInput = document.querySelector('input[name="title"]');
    
    quickAddBtn.addEventListener('click', function() {
        taskInput.focus();
        taskInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });

    // Auto-focus on input when page loads
    if (taskInput) {
        taskInput.focus();
    }

    // Add keyboard shortcuts
    document.addEventListener('keydown', function(e) {
        // Ctrl/Cmd + Enter to submit form
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            const form = document.querySelector('form');
            if (form) form.submit();
        }
    });

    // Add success message for completed tasks
    const completedTasks = document.querySelectorAll('.todo-item.completed');
    completedTasks.forEach(task => {
        const icon = task.querySelector('.fa-check-circle');
        if (icon) {
            icon.style.animation = 'pulse 2s infinite';
        }
    });
});
</script>

    </main>

    <footer class="footer" style="background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);">
        <div class="content has-text-centered">
            <p class="has-text-grey">
                <strong>TaskFlow</strong> - Made with <i class="fas fa-heart has-text-danger"></i> using Django & Bulma
            </p>
        </div>
    </footer>

    <script>
        // Add smooth scrolling and modern interactions
        document.addEventListener('DOMContentLoaded', function() {
            // Add loading states to buttons
            const buttons = document.querySelectorAll('button[type="submit"]');
            buttons.forEach(button => {
                button.addEventListener('click', function(e) {
                    if (!this.disabled) {
                        this.classList.add('is-loading');
                    }
                });
            });

            // Add entrance animations
            const cards = document.querySelectorAll('.card-modern, .todo-item');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    card.style.transition = 'all 0.6s ease';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, index * 100);
            });
        });
    </script>
</body>
</html>
